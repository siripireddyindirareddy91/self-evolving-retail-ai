services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: sqlite:////data/retailmind.db
      SESSION_SECRET: ${SESSION_SECRET:-retailmind-local-demo-change-before-hosting}
      ALLOWED_ORIGINS: http://localhost:3000
    volumes:
      - retailmind-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  retailmind-data:
